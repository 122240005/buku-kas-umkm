<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buku Kas UMKM</title>
    <!-- Tambahkan stylesheet/CSS kamu jika ada -->
</head>
<body style="margin: 0; background-color: #0f172a; font-family: sans-serif;">

    <!-- 1. HALAMAN LOGIN (Tampil Pertama Kali) -->
    <div id="login-screen" style="min-height: 100vh; display: flex; align-items: center; justify-content: center;">
        <div style="background: #1e293b; padding: 30px; border-radius: 12px; width: 90%; max-width: 340px; text-align: center; color: white; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
            <h2 style="margin-bottom: 8px;">🔐 Login Buku Kas</h2>
            <p style="font-size: 13px; color: #94a3b8; margin-bottom: 20px;">Silakan masuk untuk mengakses data</p>
            
            <input type="text" id="login-user" placeholder="Username" style="width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; box-sizing: border-box;">
            <input type="password" id="login-pass" placeholder="Password" style="width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; box-sizing: border-box;">
            
            <button onclick="handleLogin()" style="width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">Masuk Web</button>
            <p id="login-error" style="color: #ef4444; font-size: 13px; margin-top: 12px; display: none;"></p>
        </div>
    </div>

    <!-- 2. HALAMAN UTAMA APLIKASI (Default Disembunyikan) -->
    <div id="main-app" style="display: none; padding: 20px; color: white;">
        
        <!-- Tombol Logout -->
        <div style="display: flex; justify-content: flex-end; margin-bottom: 20px;">
            <button onclick="handleLogout()" style="background: #dc2626; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold;">🔒 Logout</button>
        </div>

        <!-- =================================================== -->
        <!-- TEMPATKAN SELURUH KODE DASHBOARD/APLIKASI KAMU DI SINI -->
        <!-- =================================================== -->

    </div>

    <!-- SCRIPT LOGIKA LOGIN & UTAMA -->
    <script>
        // Cek status login saat halaman dibuka
        document.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('isLoggedIn') === 'true') {
                showMainApp();
            } else {
                showLoginScreen();
            }
        });

        async function handleLogin() {
            const username = document.getElementById('login-user').value;
            const password = document.getElementById('login-pass').value;
            const errorEl = document.getElementById('login-error');

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();
                if (data.success) {
                    localStorage.setItem('isLoggedIn', 'true');
                    showMainApp();
                } else {
                    errorEl.innerText = data.message || "Username atau Password salah!";
                    errorEl.style.display = 'block';
                }
            } catch (err) {
                errorEl.innerText = "Gagal terhubung ke server.";
                errorEl.style.display = 'block';
            }
        }

        function handleLogout() {
            localStorage.removeItem('isLoggedIn');
            showLoginScreen();
        }

        function showMainApp() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
        }

        function showLoginScreen() {
            document.getElementById('login-screen').style.display = 'flex';
            document.getElementById('main-app').style.display = 'none';
        }
    </script>
</body>
</html>
