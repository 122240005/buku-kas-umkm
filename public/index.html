<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akuntansi UMKM - AI Smart Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen p-4 md:p-6">

    <div class="max-w-3xl mx-auto space-y-5">
        
        <!-- Header -->
        <header class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold text-blue-600 flex items-center gap-2">
                    Buku Kas UMKM 
                    <span class="bg-blue-100 text-blue-700 text-xs px-2.5 py-0.5 rounded-full font-semibold">🤖 Smart AI</span>
                </h1>
                <p class="text-xs text-slate-500 mt-0.5">Pencatatan otomatis semudah mengetik pesan biasa</p>
            </div>
        </header>

        <!-- KOTAK INPUT AI -->
        <div class="bg-gradient-to-br from-blue-600 to-indigo-700 p-6 rounded-2xl text-white shadow-md">
            <h2 class="text-base font-bold mb-1 flex items-center gap-2">✨ Catat Transaksi Otomatis</h2>
            <p class="text-xs text-blue-100 mb-3">Tulis transaksi harianmu, AI akan otomatis mengelompokkan akun yang tepat.</p>
            
            <div class="flex flex-col sm:flex-row gap-2">
                <input type="text" id="ai-input" placeholder="Contoh: beli bahan baku 50rb, bayar listrik toko 100rb, atau laku 200rb transfer" 
                       class="w-full p-3 rounded-xl text-slate-800 text-sm outline-none focus:ring-2 focus:ring-yellow-400">
                <button onclick="processAI()" id="btn-ai" class="bg-yellow-400 hover:bg-yellow-300 text-slate-900 font-bold px-6 py-3 rounded-xl text-sm transition whitespace-nowrap">
                    ⚡ Catat
                </button>
            </div>

            <!-- Tombol Contoh Cepat (Standar UMKM Umum) -->
            <div class="mt-3 flex flex-wrap gap-1.5 items-center">
                <span class="text-[11px] text-blue-200">Contoh umum:</span>
                <button onclick="setExample('beli bahan dagangan 50rb')" class="bg-white/20 hover:bg-white/30 text-white text-[11px] px-2.5 py-1 rounded-lg transition">Beli Bahan Jualan</button>
                <button onclick="setExample('bayar operasional toko 100rb')" class="bg-white/20 hover:bg-white/30 text-white text-[11px] px-2.5 py-1 rounded-lg transition">Biaya Operasional</button>
                <button onclick="setExample('keperluan pribadi pemilik 25rb')" class="bg-white/20 hover:bg-white/30 text-white text-[11px] px-2.5 py-1 rounded-lg transition">Pengeluaran Pribadi</button>
                <button onclick="setExample('penjualan produk 150rb transfer')" class="bg-white/20 hover:bg-white/30 text-white text-[11px] px-2.5 py-1 rounded-lg transition">Penjualan Transfer</button>
            </div>

            <p id="ai-status" class="text-xs text-yellow-200 mt-3 hidden">
                🤖 AI sedang menguraikan transaksi...
            </p>
        </div>

        <!-- NOTIFIKASI PESAN AI -->
        <div id="ai-response-box" class="hidden bg-emerald-50 border border-emerald-200 p-4 rounded-xl text-emerald-800 text-sm flex items-start gap-3 shadow-sm">
            <span class="text-xl">✅</span>
            <div id="ai-response-text" class="font-medium text-xs md:text-sm"></div>
        </div>

        <!-- Navigasi Tab -->
        <div class="flex gap-2 border-b border-slate-300">
            <button onclick="switchTab('journal-list')" id="btn-journal-list" class="px-4 py-2 font-semibold border-b-2 border-blue-600 text-blue-600 text-sm">Riwayat Transaksi</button>
            <button onclick="switchTab('accounts')" id="btn-accounts" class="px-4 py-2 font-semibold text-slate-500 border-b-2 border-transparent text-sm">Daftar Akun (COA)</button>
        </div>

        <!-- TAB 1: RIWAYAT TRANSACTION -->
        <div id="tab-journal-list" class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
            <h3 class="text-sm font-bold text-slate-800 mb-3">Catatan Transaksi Terbaru</h3>
            <div id="journal-list-container" class="space-y-3"></div>
        </div>

        <!-- TAB 2: DAFTAR AKUN -->
        <div id="tab-accounts" class="hidden bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <table class="w-full text-left text-sm">
                <thead class="bg-slate-50 text-slate-500 uppercase text-xs">
                    <tr><th class="p-3">Kode</th><th class="p-3">Nama Akun</th><th class="p-3">Kategori</th></tr>
                </thead>
                <tbody id="accounts-table-body" class="divide-y divide-slate-100"></tbody>
            </table>
        </div>

    </div>

    <script>
        window.onload = () => { loadJournals(); loadAccounts(); };

        function setExample(text) {
            document.getElementById('ai-input').value = text;
        }

        function switchTab(tab) {
            ['journal-list', 'accounts'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.add('hidden');
                document.getElementById(`btn-${t}`).classList.remove('border-blue-600', 'text-blue-600');
                document.getElementById(`btn-${t}`).classList.add('border-transparent', 'text-slate-500');
            });
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
            document.getElementById(`btn-${tab}`).classList.add('border-blue-600', 'text-blue-600');
        }

        async function processAI() {
            const promptInput = document.getElementById('ai-input');
            const statusEl = document.getElementById('ai-status');
            const responseBox = document.getElementById('ai-response-box');
            const responseText = document.getElementById('ai-response-text');
            const btn = document.getElementById('btn-ai');

            if (!promptInput.value.trim()) return alert("Silakan masukkan kalimat transaksi lebih dulu.");

            statusEl.classList.remove('hidden');
            responseBox.classList.add('hidden');
            btn.disabled = true;

            try {
                const resAI = await fetch('/api/ai-journal', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt_text: promptInput.value })
                });

                const resultAI = await resAI.json();
                if (!resultAI.success) throw new Error(resultAI.message);

                const payload = {
                    transaction_date: new Date().toISOString().split('T')[0],
                    reference_number: "AI-AUTO",
                    description: resultAI.data.description,
                    items: resultAI.data.items
                };

                const resSave = await fetch('/api/journals', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const resultSave = await resSave.json();
                if (resultSave.success) {
                    responseText.innerText = resultAI.data.human_message || "Transaksi berhasil dicatat dengan rapi!";
                    responseBox.classList.remove('hidden');

                    promptInput.value = '';
                    switchTab('journal-list');
                    loadJournals();
                } else {
                    throw new Error(resultSave.message);
                }

            } catch (err) {
                alert("⚠️ " + err.message);
            } finally {
                statusEl.classList.add('hidden');
                btn.disabled = false;
            }
        }

        async function loadJournals() {
            const container = document.getElementById('journal-list-container');
            const res = await fetch('/api/journals');
            const result = await res.json();

            if (!result.data || result.data.length === 0) {
                container.innerHTML = '<p class="text-xs text-slate-400">Belum ada transaksi.</p>';
                return;
            }

            container.innerHTML = result.data.map(j => `
                <div class="border border-slate-100 rounded-xl p-3.5 bg-slate-50 hover:bg-white transition">
                    <div class="flex justify-between items-center mb-1.5">
                        <span class="font-bold text-slate-800 text-xs md:text-sm">${j.description}</span>
                        <span class="text-[10px] font-mono bg-blue-50 text-blue-600 px-2 py-0.5 rounded">${j.transaction_date}</span>
                    </div>
                    <div class="space-y-1 border-t border-slate-200/60 pt-2 mt-1">
                        ${j.journal_items.map(item => `
                            <div class="flex justify-between text-xs">
                                <span class="${item.debit > 0 ? 'font-medium text-slate-700' : 'pl-3 text-slate-400'}">${item.accounts ? item.accounts.name : 'Akun'}</span>
                                <span class="${item.debit > 0 ? 'text-emerald-600 font-semibold' : 'text-amber-600 font-semibold'}">
                                    ${item.debit > 0 ? 'Rp ' + Number(item.debit).toLocaleString('id-ID') : 'Rp ' + Number(item.credit).toLocaleString('id-ID')}
                                </span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        async function loadAccounts() {
            const res = await fetch('/api/accounts');
            const result = await res.json();
            document.getElementById('accounts-table-body').innerHTML = result.data.map(acc => `
                <tr class="hover:bg-slate-50">
                    <td class="p-3 font-mono text-blue-600 font-semibold text-xs">${acc.code}</td>
                    <td class="p-3 font-medium text-slate-700">${acc.name}</td>
                    <td class="p-3"><span class="bg-slate-100 px-2 py-0.5 rounded text-[11px] text-slate-500">${acc.category}</span></td>
                </tr>
            `).join('');
        }
    </script>
</body>
</html>
